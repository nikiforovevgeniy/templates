services:
  postgres:
    image: postgres:17-alpine
    container_name: nuxt-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nuxt
      POSTGRES_PASSWORD: nuxt
      POSTGRES_DB: nuxt_test
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nuxt -d nuxt_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
